<div class="flex h-screen">
    @if (menuAbierto()) {
        <div class="fixed inset-0 bg-black/50 z-40 md:hidden" (click)="cerrarMenu()"></div>
    }
    <aside class="fixed inset-y-0 left-0 z-50 w-64 bg-white p-4 flex flex-col transform transition-transform duration-300 md:static md:translate-x-0 border border-line"
            [class.translate-x-0]="menuAbierto()"
            [class.-translate-x-full]="!menuAbierto()">
        <h2 class="text-lg font-bold mb-6">Panel Admin <span class="text-primary font-display font-bold">Vareo</span></h2>
        <nav class="flex flex-col gap-2 text-ink">
            <a routerLink="/dashboard" routerLinkActive="bg-primary/20 text-primary border border-primary" class="p-2 rounded-2xl">Dashboard</a>
            <a routerLink="/categorias" routerLinkActive="bg-primary/20 text-primary border border-primary" class="p-2 rounded-2xl">Categorias</a>
        </nav>
        <div class="mt-auto">
            <button (click)="cerrarSesion()" type="button" class="w-full bg-primary/80 hover:bg-primary-dark p-2 rounded-full cursor-pointer">
                Cerrar Sesion
            </button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col">
        <header class="p-4 border-b border-line md:hidden">
            <button type="button" (click)="alternarMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                </svg>
            </button>
        </header>
        <main class="flex-1 p-6 overflow-auto">
            <router-outlet />
        </main>
    </div>
</div>
